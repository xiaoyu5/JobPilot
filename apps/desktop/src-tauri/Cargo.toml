[package]
name = "jobpilot"
version = "0.4.4"
edition = "2021"
rust-version = "1.99.1"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
uuid = { version = "=1.28.0", features = ["v4"] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-single-instance = "=2.5.4"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
